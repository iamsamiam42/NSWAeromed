<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1B3A8C;--navy-d:#132B6B;--navy-l:#E8EEFA;--red:#E4302A;--gold:#F2C71C;
  --cur:#15803D;--cur-bg:#DCFCE7;--due:#B45309;--due-bg:#FEF3C7;--exp:#B91C1C;--exp-bg:#FEE2E2;--none:#6B7280;--none-bg:#F1F2F4;
  --ink:#111827;--ink2:#374151;--muted:#6B7280;--rule:#E3E6EC;--bg:#F3F5F9;--font:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif}
html{background:var(--bg)}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}input,textarea,select{font:inherit}
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:640px;margin:0 auto}
.rondel{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px;flex-shrink:0}
.rondel img{width:100%;height:100%;border-radius:50%;display:block}
.top h1{font-size:15px;font-weight:800;line-height:1.2}
.top p{font-size:11.5px;color:rgba(255,255,255,.72)}
.wings{height:30px;margin-left:auto}
.stripe{height:4px;background:linear-gradient(90deg,var(--red) 0 70%,var(--gold) 70% 100%)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.sync{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#22A055;flex-shrink:0}
.sync.pend .dot{background:#F0A020}.sync.off .dot{background:#9CA3AF}
.sync button{margin-left:auto;background:var(--navy-l);color:var(--navy);border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px}
.card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
.card h2{font-size:15px;font-weight:800;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
input.f,textarea.f{width:100%;border:1px solid #CDD3DE;border-radius:10px;padding:11px 12px;font-size:15px;background:#fff}
textarea.f{min-height:76px;resize:vertical}
input.f:focus,textarea.f:focus{outline:2px solid var(--navy);border-color:var(--navy)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#EEF1F6;border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #CDD3DE;background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink2);text-align:left;line-height:1.25}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.chip small{display:block;font-weight:500;font-size:11px;opacity:.75}
.mini{background:none;border:0;color:var(--navy);font-weight:700;font-size:12.5px;padding:6px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid #CDD3DE;background:#fff;border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.opt.on{border-color:var(--navy);background:var(--navy-l);color:var(--navy)}
.go{width:100%;background:var(--navy);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;margin-top:18px}
.go:disabled{opacity:.45}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:600;font-size:13.5px}
.row .s{font-size:12px;color:var(--muted);margin-top:2px}
.pill{margin-left:auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-cur{background:var(--cur-bg);color:var(--cur)}.p-due{background:var(--due-bg);color:var(--due)}.p-exp{background:var(--exp-bg);color:var(--exp)}.p-none{background:var(--none-bg);color:var(--none)}.p-pend{background:#FEF3C7;color:#92400E}.p-grace{background:#DBEAFE;color:#1D4ED8}.p-lc{background:#E6EBF5;color:#475B8C}
select.f{width:100%;border:1px solid #CDD3DE;border-radius:10px;padding:11px 12px;font-size:15px;background:#fff;color:var(--ink)}
.hint{background:var(--navy-l);color:var(--navy);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;line-height:1.45}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav button{border:0;background:none;padding:10px 0 12px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:60;max-width:92vw;display:none}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13.5px}
.gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy-d),var(--navy) 60%,#24499F);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.gcard{background:#fff;border-radius:18px;width:100%;max-width:380px;padding:26px 22px;text-align:center;border-top:5px solid var(--red);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.glogos{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.glogos .r{width:68px;height:68px}.glogos .w{height:40px;background:var(--navy);border-radius:10px;padding:6px 10px;box-sizing:content-box}
.gcard h2{font-size:18px;font-weight:800;color:var(--navy)}
.gcard p.s{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.gcard label{text-align:left}
.gmsg{min-height:18px;font-size:12.5px;color:var(--exp);margin-top:10px}.gmsg.ok{color:var(--cur)}
.glink{background:none;border:0;color:var(--navy);font-weight:700;font-size:12.5px;margin-top:12px}
</style>
</head>

    <h2 id="g-title">Sign in</h2>
    <p class="s">Currency Logbook — same PIN as the dashboard</p>
    <div id="g-login">
      <label class="l" for="g-id">Staff ID</label><input class="f" id="g-id" autocomplete="username">
      <label class="l" for="g-pin">4-digit PIN</label><input class="f" id="g-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="go" onclick="doLogin()">Sign in</button>
      <button class="glink" onclick="gateMode('reset')">First time, or forgot PIN?</button>
    </div>
    <div id="g-reset" style="display:none">
      <label class="l" for="g-rid">Staff ID</label><input class="f" id="g-rid">
      <button class="go" onclick="doRequestCode()">Email me a code</button>
      <div id="g-codebox" style="display:none">
        <label class="l" for="g-code">Code from email</label><input class="f" id="g-code" inputmode="numeric" maxlength="6">
        <label class="l" for="g-new">New 4-digit PIN</label><input class="f" id="g-new" type="password" inputmode="numeric" maxlength="4">
        <label class="l" for="g-new2">Repeat PIN</label><input class="f" id="g-new2" type="password" inputmode="numeric" maxlength="4">
        <button class="go" onclick="doSetPin()">Save PIN</button>
      </div>
      <button class="glink" onclick="gateMode('login')">Back to sign in</button>
    </div>
    <div class="gmsg" id="g-msg"></div>
  </div>
</div>

<script>
// ═══ CONFIG — paste the NSW Apps Script web app URL ═══════════════
const SCRIPT_URL    = 'https://script.google.com/macros/s/AKfycbzZHA1CKPgN6J0LFtWvcN57NMvARhkB0R9GSMra3mBObsleYpS_Qora0bAywKXVGkEf/exec';
const DASHBOARD_URL = './';   // dashboard is index.html in the same repo

// ═══ storage (wrapped: private browsing can throw) ═══════════════
const SKEY='nswa_session_v1', DKEY='nswa_logbook_v1';
const store={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
let SESSION=store.get(SKEY,null);
let DB=store.get(DKEY,null)||{queue:[],rejected:[],me:null,rules:[],warn:30,lastSync:null,owner:null};
if(SESSION && DB.owner && DB.owner!==SESSION.id) DB={queue:[],rejected:[],me:null,rules:[],warn:30,lastSync:null,owner:SESSION.id};
function save(){ store.set(DKEY,DB); }

// ═══ helpers ══════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function days(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function fmt(iso){ if(!iso) return '–'; const [y,m,d]=iso.split('-'); return d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y; }
function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',3200); }
function uid(){ return 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const RULE=()=>{ const o={}; DB.rules.forEach(r=>o[r.code]=r); return o; };
const SETTINGS={Aviation:['Aircraft','Static rig / simulator'],Clinical:['Real patient','Simulation'],Mixed:['Aircraft','Real patient','Simulation / static'],RAAC:['Training','Operational','Assessment']};
const SETTINGS_OTHER=['Training','Operational','Assessment'];

// ═══ API ══════════════════════════════════════════════════════════
async function apiGet(p){ const r=await fetch(SCRIPT_URL+'?'+new URLSearchParams({...p,t:Date.now()})); return r.json(); }
async function apiPost(b){ const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(b)}); return r.json(); }

// ═══ gate ═════════════════════════════════════════════════════════
function gmsg(t,ok){ const m=$('g-msg'); m.textContent=t||''; m.className='gmsg'+(ok?' ok':''); }
function gateMode(m){ $('g-login').style.display=m==='login'?'':'none'; $('g-reset').style.display=m==='reset'?'':'none'; $('g-title').textContent=m==='login'?'Sign in':'Set up / reset PIN'; gmsg(''); }
function showGate(msg){ $('gate').style.display='flex'; gateMode('login'); if(msg) gmsg(msg); }
async function doLogin(){
  const id=$('g-id').value.trim(), pin=$('g-pin').value.trim();
  if(!id||!/^\d{4}$/.test(pin)){ gmsg('Enter your Staff ID and 4-digit PIN'); return; }
  gmsg('Checking…',true);
  try{
    const j=await apiPost({action:'login',id,pin});
    if(j.status==='success'){
      SESSION={token:j.token,role:j.role,id:j.id,name:j.name}; store.set(SKEY,SESSION);
      if(DB.owner!==j.id){ const q=DB.owner?[]:DB.queue; DB={queue:q,rejected:[],me:null,rules:DB.rules,warn:30,lastSync:null,owner:j.id}; save(); }
      $('g-pin').value=''; $('gate').style.display='none'; boot();
    } else if(j.status==='nopin'){ $('g-rid').value=id; gateMode('reset'); gmsg('No PIN set yet — request a code to create one.',true); }
    else gmsg(j.message||'Could not sign in');
  }catch(e){ gmsg('No connection — sign-in needs signal once'); }
}
async function doRequestCode(){
  const id=$('g-rid').value.trim(); if(!id){ gmsg('Enter your Staff ID'); return; }
  gmsg('Sending…',true);
  try{ const j=await apiGet({action:'requestCode',id}); if(j.status==='success'){ $('g-codebox').style.display=''; gmsg(j.message,true); } else gmsg(j.message||'Could not send'); }catch(e){ gmsg('Connection problem'); }
}
async function doSetPin(){
  const id=$('g-rid').value.trim(), code=$('g-code').value.trim(), p1=$('g-new').value.trim(), p2=$('g-new2').value.trim();
  if(!/^\d{4}$/.test(p1)){ gmsg('PIN must be exactly 4 digits'); return; }
  if(p1!==p2){ gmsg('PINs do not match'); return; }
  try{ const j=await apiPost({action:'setPin',id,code,pin:p1}); if(j.status==='success'){ $('g-id').value=id; gateMode('login'); gmsg('PIN saved — sign in below.',true); $('g-codebox').style.display='none'; } else gmsg(j.message||'Could not save PIN'); }catch(e){ gmsg('Connection problem'); }
}

// ═══ load + sync ══════════════════════════════════════════════════
async function refreshMine(){
  try{
    const j=await apiGet({action:'getMine',token:SESSION.token});
    if(j.status==='auth'){ store.set(SKEY,null); SESSION=null; showGate('Session expired — sign in again (your unsent entries are kept)'); return; }
    if(j.status!=='success') return;
    DB.me=j.me; DB.rules=j.rules||DB.rules; DB.warn=(j.config&&+j.config.warn_days)||30; DB.owner=SESSION.id; save(); renderAll();
  }catch(e){ renderSync(); }
}
let syncing=false;
async function syncNow(manual){
  if(!SESSION||syncing) return;
  if(!DB.queue.length){ if(manual){ await refreshMine(); toast('Up to date'); } return; }
  syncing=true; renderSync();
  try{
    const j=await apiPost({action:'addEntry',token:SESSION.token,entries:DB.queue.map(q=>({entryId:q.id,code:q.code,date:q.date,expiry:q.expiry||'',setting:q.setting,supervisor:q.supervisor,notes:q.notes}))});
    if(j.status==='auth'){ store.set(SKEY,null); SESSION=null; showGate('Session expired — sign in again to send your entries'); return; }
    if(j.status!=='success') throw new Error(j.message);
    const ok=new Set(j.saved||[]); const rej={}; (j.rejected||[]).forEach(r=>rej[r.id]=r.why);
    const sent=DB.queue.filter(q=>ok.has(q.id)).length;
    DB.rejected=DB.rejected.concat(DB.queue.filter(q=>rej[q.id]).map(q=>({...q,why:rej[q.id]})));
    DB.queue=DB.queue.filter(q=>!ok.has(q.id)&&!rej[q.id]);
    if(j.me) DB.me=j.me;
    DB.lastSync=new Date().toISOString(); save();
    toast(Object.keys(rej).length?`⚠️ ${sent} saved, ${Object.keys(rej).length} rejected — see History`:`✅ ${sent} entr${sent===1?'y':'ies'} saved`);
  }catch(e){ if(manual) toast('Offline — entries kept on this phone and will send later'); }
  finally{ syncing=false; renderAll(); }
}
window.addEventListener('online',()=>syncNow());
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncNow(); });

// ═══ views ════════════════════════════════════════════════════════
let VIEW='log';
const FORM={code:'',setting:'',date:today(),sup:'',notes:'',expiry:''};
function go(v){ VIEW=v; ['log','mine','hist'].forEach(k=>{ $('v-'+k).style.display=k===v?'':'none'; $('n-'+k).classList.toggle('on',k===v); }); renderAll(); window.scrollTo(0,0); }
function renderAll(){ renderSync(); if(VIEW==='log') renderLog(); if(VIEW==='mine') renderMine(); if(VIEW==='hist') renderHist(); }
function renderSync(){
  const q=DB.queue.length, el=$('sync');
  el.className='sync'+(syncing?' pend':q?' pend':navigator.onLine?'':' off');
  $('sync-t').textContent=syncing?'Sending…':q?`${q} entr${q===1?'y':'ies'} waiting to send`:(navigator.onLine?('Up to date'+(DB.lastSync?' · '+new Date(DB.lastSync).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}):'')):'Offline');
  if(SESSION) $('who').textContent=SESSION.name+' · '+SESSION.id;
}
function itemFor(code){
  const me=DB.me; const r=RULE()[code]||{}; let exp='', last='', kind='';
  if(me){ const a=me.it.find(x=>x[0]===code); if(a){ exp=a[1]; last=a[3]; kind=a[2]; } }
  DB.queue.filter(q=>q.code===code).forEach(q=>{
    if(!last||q.date>last) last=q.date;
    if(r.once){ if(!exp){ exp=q.date; kind='L'; } return; }
    const e=q.expiry||(r.interval?addDays(q.date,r.interval):''); if(e&&(!exp||e>exp)){ exp=e; kind='E'; }
  });
  if(kind==='L') return {st:'lc',exp,last};
  if(!exp) return {st:'none',exp:'',last};
  const d=days(today(),exp);
  const ge=r.graceDate?(r.graceDate>exp?r.graceDate:''):(+r.grace>0?addDays(exp,+r.grace):'');
  if(d<0&&ge&&today()<=ge) return {st:'grace',exp,last,d,graceEnd:ge,graceLeft:days(today(),ge)};
  return {st:d<0?'exp':d<=DB.warn?'due':'cur',exp,last,d};
}
function stLabel(i){ return i.st==='grace'?'In grace — '+i.graceLeft+'d left':i.st==='lc'?'Completed':i.st==='none'?'No record':i.st==='exp'?'Expired':i.st==='due'?i.d+'d left':'Current'; }
// currencies offered = those the Requirements tab lists for this clinician's group
function myList(){
  if(!DB.me) return [];
  const req=new Set(DB.me.it.filter(a=>a[4]||a[7]).map(a=>a[0]));   // required (Y) or optional (O) for their group
  return DB.rules.filter(r=>r.loggable&&req.has(r.code));
}
function ruleHint(r){
  if(r.once) return 'Once-off — records as completed';
  if(r.interval) return `${r.interval}-day currency${r.graceDate?' (grace to '+fmt(r.graceDate)+')':+r.grace?' ('+r.grace+'-day grace)':''} — completing it resets expiry to ${fmt(addDays(FORM.date||today(),r.interval))}`;
  return 'Enter the new expiry date from your training record';
}
function renderLog(){
  const L=myList();
  if(!L.length){ $('v-log').innerHTML='<div class="card empty">Loading your currencies… (needs signal the first time)</div>'; return; }
  const R=RULE(), r=FORM.code?R[FORM.code]:null;
  const cat=r?r.category:'Aviation', sets=SETTINGS[cat]||SETTINGS_OTHER;
  if(!sets.includes(FORM.setting)) FORM.setting='';
  const needExp=r&&!r.once&&!r.interval;
  const ready=FORM.code&&FORM.date&&FORM.sup.trim()&&(!needExp||(FORM.expiry&&FORM.expiry>FORM.date));
  const pref=['Aviation','Mixed','Clinical'], present=[...new Set(L.map(x=>x.category))];
  const groups=pref.filter(c=>present.includes(c)).concat(present.filter(c=>!pref.includes(c))).map(c=>{ const g=L.filter(x=>x.category===c); if(!g.length) return '';
    return `<optgroup label="${c}">${g.map(x=>{ const i=itemFor(x.code); return `<option value="${x.code}" ${FORM.code===x.code?'selected':''}>${esc(x.currency)} — ${esc(stLabel(i))}</option>`; }).join('')}</optgroup>`; }).join('');
  const cur=r?itemFor(r.code):null;
  $('v-log').innerHTML=`<div class="card">
    <h2>Log a currency</h2><div class="sub">Your required currencies, from the Requirements list for ${esc(DB.me.group)}.</div>
    <label class="l" for="f-code">Currency completed</label>
    <select class="f" id="f-code" onchange="FORM.code=this.value;FORM.expiry='';renderLog()"><option value="">Select…</option>${groups}</select>
    ${r?`<div class="hint"><b>${esc(stLabel(cur))}</b>${cur.exp?(cur.st==='lc'?' · completed '+fmt(cur.exp):(cur.st==='exp'||cur.st==='grace'?' · expired ':' · expires ')+fmt(cur.exp)):''}${cur.st==='grace'?' · grace until '+fmt(cur.graceEnd):''}<br>${esc(ruleHint(r))}</div>`:''}
    <label class="l" for="f-date">Date completed</label><input class="f" id="f-date" type="date" max="${today()}" value="${FORM.date}" onchange="FORM.date=this.value;renderLog()">
    ${needExp?`<label class="l" for="f-exp">New expiry date</label><input class="f" id="f-exp" type="date" min="${FORM.date}" value="${FORM.expiry}" onchange="FORM.expiry=this.value;renderLog()">`:''}
    <label class="l" for="f-sup">Completed with</label><input class="f" id="f-sup" value="${esc(FORM.sup)}" oninput="FORM.sup=this.value;document.getElementById('f-go').disabled=!(${JSON.stringify(!!(FORM.code&&FORM.date&&(!needExp||(FORM.expiry&&FORM.expiry>FORM.date))))}&&this.value.trim())" placeholder="Name and role — e.g. J Smith, Crewman / Educator">
    ${r?`<label class="l">Setting (optional)</label><div class="opts">${sets.map(x=>`<button class="opt ${FORM.setting===x?'on':''}" onclick="FORM.setting=FORM.setting==='${x}'?'':'${x}';renderLog()">${x}</button>`).join('')}</div>`:''}
    <label class="l" for="f-notes">Notes (optional)</label><textarea class="f" id="f-notes" oninput="FORM.notes=this.value" placeholder="Aircraft, scenario, learning points (no patient identifiers)">${esc(FORM.notes)}</textarea>
    <button class="go" id="f-go" ${ready?'':'disabled'} onclick="submitLog()">Save entry</button>
  </div>`;
}
function submitLog(){
  const R=RULE(), r=R[FORM.code];
  if(!r) return;
  if(!FORM.date||FORM.date>today()){ toast('Check the date'); return; }
  if(!FORM.sup.trim()){ toast('Add who it was completed with'); return; }
  const needExp=!r.once&&!r.interval;
  if(needExp&&!(FORM.expiry&&FORM.expiry>FORM.date)){ toast('Add the new expiry date'); return; }
  DB.queue.push({id:uid(),code:r.code,currency:r.currency,date:FORM.date,expiry:needExp?FORM.expiry:'',setting:FORM.setting,supervisor:FORM.sup.trim(),notes:FORM.notes.trim(),at:new Date().toISOString()});
  FORM.code=''; FORM.notes=''; FORM.expiry=''; save();   // keep date + "completed with" for the next entry
  toast(`${r.currency} saved — sending…`); renderAll(); syncNow();
}
function renderMine(){
  const me=DB.me;
  if(!me){ $('v-mine').innerHTML='<div class="card empty">Connect once to load your currency.</div>'; return; }
  const R=RULE();
  const items=me.it.filter(a=>R[a[0]]&&a[4]).map(a=>({r:R[a[0]],...itemFor(a[0])}));
  const ord={exp:0,none:1,grace:2,due:3,cur:4,lc:5}; items.sort((a,b)=>ord[a.st]-ord[b.st]||(a.d??0)-(b.d??0));
  const t={cur:0,due:0,grace:0,exp:0,none:0,lc:0}; items.forEach(i=>t[i.st]++);
  $('v-mine').innerHTML=`<div class="card"><h2>My currency</h2><div class="sub">${t.cur} current · ${t.due} due ≤ ${DB.warn} days · ${t.grace} in grace · ${t.exp} expired · ${t.none} no record</div>
    ${items.map(i=>`<div class="row"><div><div class="nm">${esc(i.r.currency)}</div><div class="s">${i.exp?(i.st==='lc'?'Completed ':i.st==='grace'?'Expired '+fmt(i.exp)+' · grace until ':i.st==='exp'?'Expired ':'Expires ')+(i.st==='grace'?fmt(i.graceEnd):fmt(i.exp)):'No record'}${i.last?' · last logged '+fmt(i.last):''}</div></div><span class="pill p-${i.st}">${esc(stLabel(i))}</span></div>`).join('')}
    <a href="${DASHBOARD_URL}" style="display:block;text-align:center;margin-top:14px;font-weight:700;color:var(--navy);text-decoration:none">Open full dashboard →</a></div>
    <button class="mini" style="display:block;margin:0 auto" onclick="signOut()">Sign out</button>`;
}
function renderHist(){
  const R=RULE();
  const pend=DB.queue.map(q=>`<div class="row"><div><div class="nm">${esc(q.currency)}</div><div class="s">${fmt(q.date)} · with ${esc(q.supervisor)}${q.expiry?' · expires '+fmt(q.expiry):''}</div></div><span class="pill p-pend">Waiting</span></div>`).join('');
  const rej=DB.rejected.map((q,i)=>`<div class="row"><div><div class="nm">${esc(q.currency)}</div><div class="s">${fmt(q.date)} · ${esc(q.why)}</div></div><button class="mini" onclick="DB.rejected.splice(${i},1);save();renderHist()">Dismiss</button></div>`).join('');
  const logs=(DB.me&&DB.me.logs)||[];
  $('v-hist').innerHTML=(pend?`<div class="card"><h2>Waiting to send</h2>${pend}</div>`:'')+(rej?`<div class="card"><h2>Not accepted</h2>${rej}</div>`:'')+
    `<div class="card"><h2>Saved entries</h2><div class="sub">Your most recent 40</div>${logs.length?logs.map(l=>`<div class="row"><div><div class="nm">${esc(R[l[2]]?R[l[2]].currency:l[2])}</div><div class="s">${fmt(l[1])}${l[4]?' · with '+esc(l[4]):''}${l[3]?' · '+esc(l[3]):''}</div></div><span class="pill p-cur">Saved</span></div>`).join(''):'<div class="empty">No entries yet.</div>'}</div>`;
}
function signOut(){
  if(DB.queue.length && !confirm(DB.queue.length+' entries have not been sent. Sign out anyway? They will be kept on this phone.')) return;
  const t=SESSION&&SESSION.token; SESSION=null; store.set(SKEY,null); if(t) apiGet({action:'logout',token:t}).catch(()=>{}); showGate();
}

function boot(){
  if(SCRIPT_URL.includes('PASTE')){ $('v-log').innerHTML='<div class="card empty"><b>Setup needed.</b> Paste the NSW Apps Script URL into SCRIPT_URL.</div>'; return; }
  if(!SESSION){ showGate(); return; }
  renderAll(); refreshMine().then(()=>syncNow());
}
boot();
</script>
</body>
</html>
