<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A8C;--navy-d:#132B6B;--navy-l:#E8EEFA;--red:#E4302A;--gold:#F2C71C;
  --cur:#15803D;--cur-bg:#DCFCE7;
  --due:#B45309;--due-bg:#FEF3C7;
  --exp:#B91C1C;--exp-bg:#FEE2E2;
  --none:#6B7280;--none-bg:#F1F2F4;
  --lc:#475569;--lc-bg:#EEF0F3;--gr:#1D4ED8;--gr-bg:#DBEAFE;
  --ink:#111827;--ink2:#374151;--muted:#6B7280;--rule:#E3E6EC;--bg:#F3F5F9;--surface:#fff;
  --r:12px;--sh:0 1px 3px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --font:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
html{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;min-height:100vh;background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}

/* top bar */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar-in{display:flex;align-items:center;gap:14px;padding:0 20px;height:68px;max-width:1500px;margin:0 auto}
.rondel{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.rondel img{width:100%;height:100%;border-radius:50%;display:block}
.titles h1{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.titles p{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
.wings{height:44px;margin-left:8px;flex-shrink:0}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.upd{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.65)}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.stripe{height:4px;background:linear-gradient(90deg,var(--red) 0 70%,var(--gold) 70% 100%)}
@media(max-width:820px){.upd{display:none}}
@media(max-width:640px){#refresh-btn,#logbook-btn{display:none!important}.wings{height:30px;margin-left:2px}}
@media(max-width:520px){.topbar-in{padding:0 12px;gap:10px}.titles p{display:none}.titles h1{font-size:14px}.rondel{width:40px;height:40px}.tbtn{padding:6px 10px;font-size:11.5px}}

/* layout */
.wrap{max-width:1500px;margin:0 auto;padding:20px}
@media(max-width:520px){.wrap{padding:14px 16px}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tab{background:var(--surface);border:1px solid var(--rule);color:var(--ink2);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filters select,.filters input{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink)}
.filters input{min-width:180px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--navy-l);color:var(--navy)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h2{font-size:14px;font-weight:700;margin-bottom:4px}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-top:3px solid var(--navy)}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.cur{border-top-color:var(--cur)}.kpi.cur .v{color:var(--cur)}
.kpi.due{border-top-color:#D97706}.kpi.due .v{color:var(--due)}
.kpi.exp{border-top-color:var(--exp)}.kpi.exp .v{color:var(--exp)}
.kpi.grace{border-top-color:#3B82F6}.kpi.grace .v{color:var(--gr)}.kpi.none{border-top-color:#9CA3AF}.kpi.none .v{color:var(--none)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}

/* bars */
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--none-bg);gap:2px}
.sbar i{display:block;height:100%}
.sbar .c{background:#22A055}.sbar .d{background:#F0A020}.sbar .g{background:#3B82F6}.sbar .e{background:#D93A32}.sbar .n{background:#C9CDD4}
.grow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.grow:last-child{border-bottom:0}
.grow .nm{font-weight:600;font-size:13px}
.grow .pc{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--rule);background:#FAFBFD;position:sticky;top:0;z-index:2}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F9FD}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-cur{background:var(--cur-bg);color:var(--cur)}.p-due{background:var(--due-bg);color:var(--due)}
.p-exp{background:var(--exp-bg);color:var(--exp)}.p-none{background:var(--none-bg);color:var(--none)}.p-lc{background:var(--lc-bg);color:var(--lc)}.p-grace{background:var(--gr-bg);color:var(--gr)}
.cat{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--navy-l);color:var(--navy)}
.cat.Clinical{background:#FDE8E7;color:#A3231E}.cat.Mixed{background:#FEF6D8;color:#8A6A00}.cat.RAAC{background:#E6F4F1;color:#0F6E5C}

/* matrix */
.mx-wrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--rule);border-radius:10px;background:#fff}
.mx{border-collapse:separate;border-spacing:0;font-size:11px}
.mx th,.mx td{padding:0;border-bottom:1px solid #EEF0F4;border-right:1px solid #EEF0F4}
.mx thead th{position:sticky;top:0;background:#FAFBFD;z-index:3;height:170px;vertical-align:bottom;text-transform:none;letter-spacing:0}
.mx thead th .vh{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:8px 0;margin:0 auto;font-size:11px;font-weight:600;color:var(--ink2);max-height:160px;overflow:hidden;text-overflow:ellipsis}
.mx thead th.cat-Clinical .vh{color:#A3231E}.mx thead th.cat-Mixed .vh{color:#8A6A00}.mx thead th.cat-RAAC .vh{color:#0F6E5C}
.mx .nmh,.mx .nmc{position:sticky;left:0;background:#fff;z-index:2;min-width:190px;max-width:190px;padding:6px 10px;text-align:left}
.mx thead .nmh{z-index:4;background:#FAFBFD;vertical-align:bottom;padding-bottom:10px}
.mx .nmc{cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx .nmc small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.mx .nmc:hover{color:var(--navy);text-decoration:underline}
.mx td.c{width:30px;min-width:30px;height:34px;text-align:center;font-family:var(--mono);font-size:10px;font-weight:700}
.c.cur{background:#C9EFD6;color:#166534}.c.due{background:#FDE3A6;color:#92400E}.c.exp{background:#F7B9B5;color:#7F1D1D}
.c.none{background:repeating-linear-gradient(45deg,#F3F4F6 0 4px,#E5E7EB 4px 8px);color:#6B7280}.c.lc{background:#EEF0F3;color:#475569}.c.grace{background:#BFDBFE;color:#1E3A8A}
.c.na{background:#fff}.c.opt{opacity:.45}

/* person */
.person-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid var(--gold)}
.person-head h2{font-size:20px;font-weight:800}
.person-head .meta{font-size:13px;color:var(--muted);margin-top:2px}
.back{background:none;border:0;color:var(--navy);font-weight:700;font-size:13px;margin-bottom:12px;padding:0}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 120px 150px 96px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.crow:last-child{border-bottom:0}
.crow .nm{font-weight:600;font-size:13px}
.crow .src{font-size:11.5px;color:var(--muted);margin-top:2px}
.crow .dt{font-family:var(--mono);font-size:12px}
.life{height:8px;border-radius:4px;background:#EEF0F4;overflow:hidden}
.life i{display:block;height:100%;border-radius:4px}
@media(max-width:640px){.crow{grid-template-columns:minmax(0,1fr) 90px;row-gap:6px}.crow .life-c{grid-column:1/-1}.crow .dt{text-align:right}}
.sec-h{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.sec-h h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy)}
details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2);padding:6px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--navy-l);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{background:#FFF8E1;border:1px solid #F5DE8A;color:#6B5200;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--rule)}

/* gate */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy-d),var(--navy) 60%,#24499F);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.gcard{background:#fff;border-radius:18px;width:100%;max-width:380px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;border-top:5px solid var(--red)}
.glogos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.glogos .r{width:74px;height:74px}
.glogos .w{height:44px;background:var(--navy);border-radius:10px;padding:6px 10px;box-sizing:content-box}
.gcard h2{font-size:18px;font-weight:800;color:var(--navy)}
.gcard p.s{font-size:12.5px;color:var(--muted);margin:4px 0 18px}
.gcard label{display:block;text-align:left;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.gcard input{width:100%;border:1px solid #CDD3DE;border-radius:9px;padding:11px 12px;font-size:15px}
.gcard input:focus{outline:2px solid var(--navy);border-color:var(--navy)}
.gcard .btn{width:100%;margin-top:16px;padding:12px}
.gmsg{min-height:18px;font-size:12.5px;color:var(--exp);margin-top:10px}
.gmsg.ok{color:var(--cur)}
.glink{background:none;border:0;color:var(--navy);font-weight:700;font-size:12.5px;margin-top:12px}
/* report */
.rp-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.rp-bar label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.rp-bar input[type=date]{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px}
.rp-note{font-size:12px;color:var(--muted);line-height:1.5}
.rp-page{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:26px 28px;max-width:1000px}
.rp-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--navy);padding-bottom:12px;margin-bottom:14px}
.rp-head img.r{width:52px;height:52px}.rp-head img.w{height:34px;background:var(--navy);border-radius:6px;padding:4px 8px;margin-left:auto}
.rp-head h1{font-size:20px;font-weight:800;color:var(--navy)}
.rp-page h3{font-size:14px;font-weight:800;color:var(--navy);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.rp-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.rp-tbl th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:static}
.rp-tbl td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.rp-tbl td.n,.rp-tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.rp-tbl tr.tot td{font-weight:800;background:#F3F5F9}
.cov{display:inline-block;width:70px;height:7px;background:#EEF0F4;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.cov i{display:block;height:100%}
@media print{
  @page{size:A4;margin:12mm}
  html,body{background:#fff}
  .topbar,.tabs,.filters,.tbtn,.back,.no-print{display:none!important}
  .wrap{padding:0;max-width:none}.card,.kpi{box-shadow:none}
  .rp-page{border:0;padding:0;max-width:none}
  .rp-tbl th,.rp-tbl tr.tot td,.rp-head img.w,.cov i,.pill,.cat{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp-tbl tr{page-break-inside:avoid}
}
</style>
</head>

    <div id="g-login">

  if (v === null || v === undefined || v === '') return '';

function parseExportValue(v){

<script>
// ═══ CONFIG — paste the NSW Apps Script web app URL ═══════════════

function sessGet(){ try{ return JSON.parse(localStorage.getItem(SKEY)||'null'); }catch(e){ return null; } }

// ═══ helpers ══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function days(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5); }
function localToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(iso){ if(!iso) return '–'; const [y,m,d]=iso.split('-'); return d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y; }
function fmtS(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y.slice(2); }
function initials(n){ return String(n||'?').split(',').map(p=>p.trim()[0]||'').reverse().join('').toUpperCase().slice(0,2); }
function firstLast(n){ const p=String(n).split(','); return p.length>1?(p[1].trim()+' '+p[0].trim()):n; }

// grace = N days after expiry, or a drop-dead date set for the training year
function graceEndOf(exp,r){ if(!exp||!r) return ''; if(r.graceDate) return r.graceDate>exp?r.graceDate:''; return +r.grace>0?addDays(exp,+r.grace):''; }
// categories come from the Rules tab: known ones first, then any new ones (e.g. RAAC)
function CATS(){ const pref=['Aviation','Mixed','Clinical']; const all=[...new Set(RULES.map(r=>r.category))]; return pref.filter(c=>all.includes(c)).concat(all.filter(c=>!pref.includes(c))); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function shortName(c){
  return c.replace(/^MTS\s*-?\s*NSWA\s*-\s*/i,'').replace(/^NSWA\s*-\s*/i,'')
    .replace('Operator Proficiency Check','OPC').replace(/Human Factors/i,'HF').replace('(Recurrent)','Rec')
    .replace('Procedures','Proc').replace('Rapid Sequence Induction','RSI').replace(/\s+/g,' ').trim();
}
function itemsOf(p){
  return p.it.filter(a=>RULE[a[0]]).map(a=>{
    const it={code:a[0],exp:a[1],kind:a[2],last:a[3],req:!!a[4],src:a[5],n:a[6]||0,rule:RULE[a[0]]};
    if(it.kind==='L'){ it.st='lc'; it.d=null; }
    else if(!it.exp){ it.st='none'; it.d=null; }
    else { it.d=days(TODAY,it.exp); it.graceEnd=graceEndOf(it.exp,it.rule);
      if(it.graceEnd){ it.graceLeft=days(TODAY,it.graceEnd); it.graceLen=days(it.exp,it.graceEnd); }
      it.st=it.d<0?((it.graceEnd&&TODAY<=it.graceEnd)?'grace':'exp'):(it.d<=WARN?'due':'cur'); }

function catOk(r){ return F.cat==='All' || r.category===F.cat; }

}
function tally(items){
  const t={cur:0,due:0,grace:0,exp:0,none:0,total:0};
  items.forEach(i=>{ if(i.req&&i.st!=='lc'&&catOk(i.rule)){ t[i.st]++; t.total++; } });

}
function sbar(t){

}

// ═══ gate ═════════════════════════════════════════════════════════

async function load(manual){
  if(SCRIPT_URL.includes('PASTE')){ $('main').innerHTML='<div class="card empty"><b>Setup needed.</b><br>Paste the NSW Apps Script web app URL into SCRIPT_URL at the top of this file.</div>'; return; }

    const admin = SESSION.role==='ADMIN';

  if(VIEW==='expiring') h+=`<select onchange="F.win=this.value;render()">${[['exp','Expired (past grace)'],['grace','In grace period'],['7','Due ≤ 7 days'],['30','Expired + due ≤ 30 days'],['60','Expired + due ≤ 60 days'],['90','Expired + due ≤ 90 days'],['none','No record']].map(([v,l])=>`<option value="${v}" ${F.win===v?'selected':''}>${l}</option>`).join('')}</select>

function expiringRows(){
  const out=[];
  peopleFiltered().forEach(p=>p.items.forEach(i=>{
    if(!i.req||i.st==='lc'||!catOk(i.rule)||(F.cur&&i.code!==F.cur)) return;
    let ok=false;
    if(F.win==='none') ok=i.st==='none';
    else if(F.win==='exp') ok=i.st==='exp';
    else if(F.win==='grace') ok=i.st==='grace';
    else if(F.win==='7') ok=i.d!=null&&i.d>=0&&i.d<=7;

    if(ok) out.push({p,i});

  return out.sort((a,b)=>(a.i.exp||'9')<(b.i.exp||'9')?-1:(a.i.exp===b.i.exp?(a.p.name<b.p.name?-1:1):1));

// days within [from,to] covered by any [start,end] interval; also counts gaps (lapses)
function coverage(intervals,from,to){
  const iv=intervals.filter(x=>x[1]>=from&&x[0]<=to).map(x=>[x[0]<from?from:x[0], x[1]>to?to:x[1]]).sort((a,b)=>a[0]<b[0]?-1:1);
  const total=days(from,to)+1; if(!iv.length) return {pct:0,lapses:1,total};
  let covered=0,lapses=0,cur=null;
  if(iv[0][0]>from) lapses++;
  iv.forEach(x=>{ if(!cur){cur=x.slice();return;} if(x[0]<=addDays(cur[1],1)){ if(x[1]>cur[1]) cur[1]=x[1]; } else { covered+=days(cur[0],cur[1])+1; lapses++; cur=x.slice(); } });
  covered+=days(cur[0],cur[1])+1; if(cur[1]<to) lapses++;
  return {pct:Math.round(covered/total*100),lapses,total};
}
function reportHtml(d){
  if(!d.me) return '<div class="card empty">No currency record found for this person — run Rebuild dashboard snapshot.</div>';
  const p={...d.me}; p.items=itemsOf(p);
  const from=d.from,to=d.to, inP=d.logs.filter(l=>l[1]>=from&&l[1]<=to);
  const byCode={}; p.items.forEach(i=>byCode[i.code]=i);
  const used=new Set(inP.map(l=>l[2]));
  const covCol=pc=>pc>=100?'#22A055':pc>=75?'#F0A020':'#D93A32';
  let grand=0;
  const sections=CATS().map(cat=>{
    const rules=RULES.filter(r=>r.category===cat&&(byCode[r.code]&&(byCode[r.code].req||byCode[r.code].rule&&p.it.some(a=>a[0]===r.code&&a[7]))||used.has(r.code)));
    if(!rules.length) return '';
    let catN=0;
    const rows=rules.map(r=>{
      const it=byCode[r.code]||{st:'none',rule:r};
      const ents=inP.filter(l=>l[2]===r.code); catN+=ents.length;
      const bySet={}; ents.forEach(l=>{ const k=l[3]||'Unspecified'; bySet[k]=(bySet[k]||0)+1; });
      const lastAll=d.logs.filter(l=>l[2]===r.code).map(l=>l[1]).pop()||'';
      let cov='—';
      if(!r.once){
        const iv=d.logs.filter(l=>l[2]===r.code).map(l=>[l[1], l[6]||(r.interval?addDays(l[1],r.interval-1):'')]).filter(x=>x[1]);
        if(it.src==='x'&&it.exp&&r.interval) iv.push([addDays(it.exp,-(r.interval-1)),it.exp]);
        if(iv.length){
          // measure from the first record if history starts inside the period (new starter / new currency)
          const first=iv.map(x=>x[0]).sort()[0], start=first>from?first:from;
          if(start<=to){ const c=coverage(iv,start,to);
            cov=`<span class="cov"><i style="width:${c.pct}%;background:${covCol(c.pct)}"></i></span>${c.pct}%${c.lapses?` · ${c.lapses} lapse${c.lapses>1?'s':''}`:''}${start>from?`<div class="rp-note">since ${fmtS(start)}</div>`:''}`; } }
      }
      const status=it.st==='lc'?'Completed '+fmtS(it.exp):it.st==='none'?'No record':it.st==='grace'?'In grace to '+fmtS(it.graceEnd):it.st==='exp'?'Expired '+fmtS(it.exp):'Current to '+fmtS(it.exp);
      return `<tr><td>${esc(r.currency)}${it.req?'':' <span class="rp-note">(optional)</span>'}</td><td class="n">${ents.length||''}</td>
        <td style="font-size:11.5px">${Object.entries(bySet).map(([k,v])=>esc(k)+' '+v).join(' · ')}</td>
        <td>${lastAll?fmtS(lastAll):'–'}</td><td style="white-space:nowrap">${cov}</td><td><span class="pill p-${it.st}">${status}</span></td></tr>`;
    }).join('');
    grand+=catN;
    return `<h3><span class="cat ${cat}">${cat}</span> ${cat} currencies</h3>
      <table class="rp-tbl"><thead><tr><th>Currency</th><th class="n">Done in period</th><th>By setting</th><th>Last done</th><th>Kept current</th><th>Status today</th></tr></thead>
      <tbody>${rows}<tr class="tot"><td>Total ${cat}</td><td class="n">${catN}</td><td colspan="4"></td></tr></tbody></table>`;
  }).join('');
  const R_=c=>RULE[c]||{currency:c,category:''};
  return `<div class="rp-page">
    <div class="rp-head"><img class="r" src="${document.querySelector('.rondel img').src}" alt=""><div><h1>Currency &amp; Skills Summary</h1>
      <div class="rp-note">Record of currency maintenance and skills performed for registration, credentialing and professional development</div></div>
      <img class="w" src="${document.querySelector('.wings').src}" alt=""></div>
    <table class="rp-tbl"><tbody>
      <tr><td><b>Clinician</b></td><td>${esc(firstLast(p.name))}</td><td><b>Staff ID</b></td><td>${esc(p.id)}</td></tr>
      <tr><td><b>Group</b></td><td>${esc(p.group)}${p.base?' · '+esc(p.base):''}</td><td><b>Period</b></td><td>${fmt(from)} – ${fmt(to)}</td></tr>
      <tr><td><b>Organisation</b></td><td>${esc($('org').textContent||'NSW Ambulance')}</td><td><b>Generated</b></td><td>${fmt(TODAY)}</td></tr>
    </tbody></table>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      ${CATS().map(c=>{ const n=inP.filter(l=>R_(l[2]).category===c).length; return n?`<div class="kpi" style="flex:1;min-width:95px;padding:10px 12px"><div class="l">${c}</div><div class="v" style="font-size:22px">${n}</div><div class="s">performed in period</div></div>`:''; }).join('')}
      <div class="kpi" style="flex:1;min-width:95px;padding:10px 12px;border-top-color:var(--gold)"><div class="l">Total</div><div class="v" style="font-size:22px">${grand}</div><div class="s">logbook entries</div></div>
    </div>
    ${sections||'<p class="rp-note" style="margin-top:14px">No currencies recorded.</p>'}
    <h3>Log of entries (${inP.length})</h3>
    ${inP.length?`<table class="rp-tbl"><thead><tr><th>Date</th><th>Currency</th><th>Category</th><th>Setting</th><th>Completed with</th></tr></thead><tbody>
      ${inP.map(l=>`<tr><td style="white-space:nowrap">${fmtS(l[1])}</td><td>${esc(R_(l[2]).currency)}</td><td>${esc(R_(l[2]).category)}</td><td>${esc(l[3])}</td><td>${esc(l[4])}</td></tr>${REPORT.notes&&l[5]?`<tr><td></td><td colspan="4" class="rp-note"><b>Notes:</b> ${esc(l[5])}</td></tr>`:''}`).join('')}
    </tbody></table>`:'<p class="rp-note">No logbook entries in this period.</p>'}
    <h3>About this record</h3>
    <div class="rp-note">Generated from the NSW Ambulance Aeromedical Currency Tracker. Logbook entries are recorded by the clinician at the time and name who the currency was completed with; they are self-reported and not independently verified by this summary. Aviation currencies marked "Export" come from the operator's training records. "Kept current" is the share of the period the currency was valid, worked out from completion dates and each currency's interval (grace periods not counted). Where records begin partway through the period it is measured from the first record ("since"); "—" means no dated history.</div>
  </div>`;
}
function downloadCSV(){
  const R=expiringRows(), q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[['Name','Staff ID','Group','Base','Currency','Category','Expiry','Days','Status','Source'].map(q).join(',')]
    .concat(R.map(({p,i})=>[p.name,p.id,p.group,p.base,i.rule.currency,i.rule.category,i.exp,i.d,ST_LABEL[i.st],i.src==='l'?'Logbook':'Export'].map(q).join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
  a.download='NSWA_currency_'+(F.win)+'_'+TODAY+'.csv'; a.click();
}

function peopleList(){
  const P=peopleFiltered();
  return `<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Group</th><th>Base</th><th style="width:28%">Required currencies</th><th class="num">Exp</th><th class="num">Grace</th><th class="num">Due</th><th class="num">None</th><th>Next expiry</th></tr></thead><tbody>
  ${P.map(p=>{ const t=tally(p.items); const nx=p.items.filter(i=>i.req&&i.d!=null&&i.d>=0&&i.st!=='lc'&&catOk(i.rule)).sort((a,b)=>a.d-b.d)[0];
    return `<tr class="click" onclick="openPerson('${esc(p.id)}')"><td><b>${esc(p.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(p.id)}</div></td><td>${esc(p.group)}</td><td>${esc(p.base||'–')}</td><td>${sbar(t)}</td><td class="num" style="color:var(--exp)">${t.exp||''}</td><td class="num" style="color:var(--gr)">${t.grace||''}</td><td class="num" style="color:var(--due)">${t.due||''}</td><td class="num" style="color:var(--none)">${t.none||''}</td><td style="font-size:12px">${nx?esc(shortName(nx.rule.currency))+' · '+fmtS(nx.exp):'–'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

function personView(p, admin){
  const items=p.items, t={cur:0,due:0,grace:0,exp:0,none:0,total:0};
  items.forEach(i=>{ if(i.req&&i.st!=='lc'){ t[i.st]++; t.total++; } });
  const order={exp:0,none:1,grace:2,due:3,cur:4};
  const row=i=>{
    const life = i.st==='grace' ? Math.max(4,Math.min(100,i.graceLeft/(i.graceLen||1)*100)) : (i.d==null?0:Math.max(0,Math.min(100, i.d/((i.rule.interval||365))*100)));
    const col = {cur:'#22A055',due:'#F0A020',grace:'#3B82F6',exp:'#D93A32'}[i.st]||'#C9CDD4';
    const src = i.src==='l'?`Logbook · last ${fmt(i.last)}${i.n>1?' · '+i.n+' entries':''}`:i.src==='x'?('Export'+(i.last?' · last logged '+fmt(i.last):'')):(i.rule.loggable?'Not logged yet':'Not in export');
    return `<div class="crow"><div><div class="nm">${esc(i.rule.currency)}</div><div class="src">${esc(src)}${i.rule.interval?' · '+i.rule.interval+'-day currency':''}${i.rule.graceDate?' · grace to '+fmt(i.rule.graceDate):+i.rule.grace?' · '+i.rule.grace+'-day grace':''}</div></div>
      <div class="dt">${i.st==='lc'?(i.src==='l'?'Done ':'LC ')+fmt(i.exp):fmt(i.exp)}</div>
      <div class="life-c">${i.st==='lc'?'':`<div class="life"><i style="width:${i.st==='exp'?100:life}%;background:${col}"></i></div><div style="font-size:11px;color:var(--muted);margin-top:3px">${i.d==null?'':i.st==='grace'?'Grace until '+fmt(i.graceEnd)+' · '+i.graceLeft+' days left':i.d<0?Math.abs(i.d)+' days overdue':i.d+' days left'}</div>`}</div>
      <div style="text-align:right"><span class="pill p-${i.st}">${ST_LABEL[i.st]}</span></div></div>`;
  };
  const section=(cat)=>{ const L=items.filter(i=>i.req&&i.st!=='lc'&&i.rule.category===cat).sort((a,b)=>order[a.st]-order[b.st]||(a.d??-1e9)-(b.d??-1e9));
    if(!L.length) return '';
    return `<div class="card" style="margin-top:16px"><div class="sec-h"><span class="cat ${cat}">${cat}</span><h3>${cat} currencies</h3></div>${L.map(row).join('')}</div>`; };
  const lc=items.filter(i=>i.st==='lc'), opt=items.filter(i=>!i.req&&i.st!=='lc');
  const logs=p.logs;
  return `<div class="card"><div class="person-head"><div class="avatar">${initials(p.name)}</div>
      <div><h2>${esc(firstLast(p.name))}</h2><div class="meta">${esc(p.group)}${p.base?' · '+esc(p.base):''} · ID ${esc(p.id)}</div></div>
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" style="padding:12px 16px;font-size:14px" onclick="showReport('${esc(p.id)}')">🖨 Print summary</button>
        ${admin?'':`<button class="btn" style="padding:12px 18px;font-size:14px" onclick="openLogbook()">＋ Log a currency</button>`}</div></div></div>
    <div class="kpis" style="margin-top:16px">
      <div class="kpi cur"><div class="l">Current</div><div class="v">${t.cur}</div><div class="s">of ${t.total} required</div></div>
      <div class="kpi due"><div class="l">Due ≤ ${WARN} days</div><div class="v">${t.due}</div></div>
      <div class="kpi grace"><div class="l">In grace</div><div class="v">${t.grace}</div></div>
      <div class="kpi exp"><div class="l">Expired</div><div class="v">${t.exp}</div></div>
      <div class="kpi none"><div class="l">No record</div><div class="v">${t.none}</div></div>
    </div>
    ${CATS().map(section).join('')}
    ${lc.length?`<div class="card" style="margin-top:16px"><details><summary>Line Check / once-off — completed (${lc.length})</summary>${lc.map(row).join('')}</details></div>`:''}
    ${opt.length?`<div class="card" style="margin-top:16px"><details><summary>Also held — not required for ${esc(p.group)} (${opt.length})</summary>${opt.map(row).join('')}</details></div>`:''}
    <div class="card" style="margin-top:16px"><h2>Recent logbook entries</h2><div class="sub">Most recent 40</div>
      ${logs==null?'<div class="empty">Loading…</div>':!logs.length?'<div class="empty">No logbook entries yet.</div>':`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Currency</th><th>Setting</th><th>Supervisor / Assessor</th><th>Notes</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="num" style="text-align:left">${fmt(l[1])}</td><td>${esc(RULE[l[2]]?RULE[l[2]].currency:l[2])}</td><td>${esc(l[3])}</td><td>${esc(l[4])}</td><td style="font-size:12px;color:var(--ink2)">${esc(l[5])}</td></tr>`).join('')}</tbody></table></div>`}
    </div>`;
}

load(true);
</script>
</body>
</html>
