<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A8C;--navy-d:#132B6B;--navy-l:#E8EEFA;--red:#E4302A;--gold:#F2C71C;
  --cur:#15803D;--cur-bg:#DCFCE7;
  --due:#B45309;--due-bg:#FEF3C7;
  --exp:#B91C1C;--exp-bg:#FEE2E2;
  --none:#6B7280;--none-bg:#F1F2F4;
  --lc:#475569;--lc-bg:#EEF0F3;--gr:#1D4ED8;--gr-bg:#DBEAFE;
  --ink:#111827;--ink2:#374151;--muted:#6B7280;--rule:#E3E6EC;--bg:#F3F5F9;--surface:#fff;
  --r:12px;--sh:0 1px 3px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
  --font:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
html{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;min-height:100vh;background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select{font:inherit}

/* top bar */
.topbar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar-in{display:flex;align-items:center;gap:14px;padding:0 20px;height:68px;max-width:1500px;margin:0 auto}
.rondel{width:46px;height:46px;border-radius:50%;background:#fff;padding:2px;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.rondel img{width:100%;height:100%;border-radius:50%;display:block}
.titles h1{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.titles p{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:2px}
.wings{height:44px;margin-left:8px;flex-shrink:0}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.upd{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.65)}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:999px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.22)}
.stripe{height:4px;background:linear-gradient(90deg,var(--red) 0 70%,var(--gold) 70% 100%)}
@media(max-width:820px){.upd{display:none}}
@media(max-width:640px){#refresh-btn,#logbook-btn{display:none!important}.wings{height:30px;margin-left:2px}}
@media(max-width:520px){.topbar-in{padding:0 12px;gap:10px}.titles p{display:none}.titles h1{font-size:14px}.rondel{width:40px;height:40px}.tbtn{padding:6px 10px;font-size:11.5px}}

/* layout */
.wrap{max-width:1500px;margin:0 auto;padding:20px}
@media(max-width:520px){.wrap{padding:14px 16px}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tab{background:var(--surface);border:1px solid var(--rule);color:var(--ink2);font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filters select,.filters input{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink)}
.filters input{min-width:180px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--navy-l);color:var(--navy)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h2{font-size:14px;font-weight:700;margin-bottom:4px}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-top:3px solid var(--navy)}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.cur{border-top-color:var(--cur)}.kpi.cur .v{color:var(--cur)}
.kpi.due{border-top-color:#D97706}.kpi.due .v{color:var(--due)}
.kpi.exp{border-top-color:var(--exp)}.kpi.exp .v{color:var(--exp)}
.kpi.grace{border-top-color:#3B82F6}.kpi.grace .v{color:var(--gr)}.kpi.none{border-top-color:#9CA3AF}.kpi.none .v{color:var(--none)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}

/* bars */
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--none-bg);gap:2px}
.sbar i{display:block;height:100%}
.sbar .c{background:#22A055}.sbar .d{background:#F0A020}.sbar .g{background:#3B82F6}.sbar .e{background:#D93A32}.sbar .n{background:#C9CDD4}
.grow{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.grow:last-child{border-bottom:0}
.grow .nm{font-weight:600;font-size:13px}
.grow .pc{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--rule);background:#FAFBFD;position:sticky;top:0;z-index:2}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7F9FD}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-cur{background:var(--cur-bg);color:var(--cur)}.p-due{background:var(--due-bg);color:var(--due)}
.p-exp{background:var(--exp-bg);color:var(--exp)}.p-none{background:var(--none-bg);color:var(--none)}.p-lc{background:var(--lc-bg);color:var(--lc)}.p-grace{background:var(--gr-bg);color:var(--gr)}
.cat{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--navy-l);color:var(--navy)}
.cat.Clinical{background:#FDE8E7;color:#A3231E}.cat.Mixed{background:#FEF6D8;color:#8A6A00}

/* matrix */
.mx-wrap{overflow:auto;max-height:calc(100vh - 230px);border:1px solid var(--rule);border-radius:10px;background:#fff}
.mx{border-collapse:separate;border-spacing:0;font-size:11px}
.mx th,.mx td{padding:0;border-bottom:1px solid #EEF0F4;border-right:1px solid #EEF0F4}
.mx thead th{position:sticky;top:0;background:#FAFBFD;z-index:3;height:170px;vertical-align:bottom;text-transform:none;letter-spacing:0}
.mx thead th .vh{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;padding:8px 0;margin:0 auto;font-size:11px;font-weight:600;color:var(--ink2);max-height:160px;overflow:hidden;text-overflow:ellipsis}
.mx thead th.cat-Clinical .vh{color:#A3231E}.mx thead th.cat-Mixed .vh{color:#8A6A00}
.mx .nmh,.mx .nmc{position:sticky;left:0;background:#fff;z-index:2;min-width:190px;max-width:190px;padding:6px 10px;text-align:left}
.mx thead .nmh{z-index:4;background:#FAFBFD;vertical-align:bottom;padding-bottom:10px}
.mx .nmc{cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx .nmc small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.mx .nmc:hover{color:var(--navy);text-decoration:underline}
.mx td.c{width:30px;min-width:30px;height:34px;text-align:center;font-family:var(--mono);font-size:10px;font-weight:700}
.c.cur{background:#C9EFD6;color:#166534}.c.due{background:#FDE3A6;color:#92400E}.c.exp{background:#F7B9B5;color:#7F1D1D}
.c.none{background:repeating-linear-gradient(45deg,#F3F4F6 0 4px,#E5E7EB 4px 8px);color:#6B7280}.c.lc{background:#EEF0F3;color:#475569}.c.grace{background:#BFDBFE;color:#1E3A8A}
.c.na{background:#fff}.c.opt{opacity:.45}

/* person */
.person-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid var(--gold)}
.person-head h2{font-size:20px;font-weight:800}
.person-head .meta{font-size:13px;color:var(--muted);margin-top:2px}
.back{background:none;border:0;color:var(--navy);font-weight:700;font-size:13px;margin-bottom:12px;padding:0}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 120px 150px 96px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.crow:last-child{border-bottom:0}
.crow .nm{font-weight:600;font-size:13px}
.crow .src{font-size:11.5px;color:var(--muted);margin-top:2px}
.crow .dt{font-family:var(--mono);font-size:12px}
.life{height:8px;border-radius:4px;background:#EEF0F4;overflow:hidden}
.life i{display:block;height:100%;border-radius:4px}
@media(max-width:640px){.crow{grid-template-columns:minmax(0,1fr) 90px;row-gap:6px}.crow .life-c{grid-column:1/-1}.crow .dt{text-align:right}}
.sec-h{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.sec-h h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy)}
details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2);padding:6px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--navy-l);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{background:#FFF8E1;border:1px solid #F5DE8A;color:#6B5200;border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--rule)}

/* gate */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy-d),var(--navy) 60%,#24499F);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.gcard{background:#fff;border-radius:18px;width:100%;max-width:380px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;border-top:5px solid var(--red)}
.glogos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px}
.glogos .r{width:74px;height:74px}
.glogos .w{height:44px;background:var(--navy);border-radius:10px;padding:6px 10px;box-sizing:content-box}
.gcard h2{font-size:18px;font-weight:800;color:var(--navy)}
.gcard p.s{font-size:12.5px;color:var(--muted);margin:4px 0 18px}
.gcard label{display:block;text-align:left;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.gcard input{width:100%;border:1px solid #CDD3DE;border-radius:9px;padding:11px 12px;font-size:15px}
.gcard input:focus{outline:2px solid var(--navy);border-color:var(--navy)}
.gcard .btn{width:100%;margin-top:16px;padding:12px}
.gmsg{min-height:18px;font-size:12.5px;color:var(--exp);margin-top:10px}
.gmsg.ok{color:var(--cur)}
.glink{background:none;border:0;color:var(--navy);font-weight:700;font-size:12.5px;margin-top:12px}
@media print{.topbar,.tabs,.filters,.tbtn,.back{display:none!important}.wrap{padding:0}.card,.kpi{box-shadow:none}}
</style>
</head>

    <h2 id="g-title">Sign in</h2>
    <p class="s">Aeromedical Currency Dashboard</p>
    <div id="g-login">
      <label for="g-id">Staff ID</label><input id="g-id" autocomplete="username" inputmode="text">
      <label for="g-pin">4-digit PIN</label><input id="g-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn" onclick="doLogin()">Sign in</button>
      <button class="glink" onclick="gateMode('reset')">First time, or forgot PIN?</button>
    </div>
    <div id="g-reset" style="display:none">
      <label for="g-rid">Staff ID</label><input id="g-rid">
      <button class="btn" onclick="doRequestCode()">Email me a code</button>
      <div id="g-codebox" style="display:none">
        <label for="g-code">Code from email</label><input id="g-code" inputmode="numeric" maxlength="6">
        <label for="g-new">New 4-digit PIN</label><input id="g-new" type="password" inputmode="numeric" maxlength="4">
        <label for="g-new2">Repeat PIN</label><input id="g-new2" type="password" inputmode="numeric" maxlength="4">
        <button class="btn" onclick="doSetPin()">Save PIN</button>
      </div>
      <button class="glink" onclick="gateMode('login')">Back to sign in</button>
    </div>
    <div class="gmsg" id="g-msg"></div>
  </div>
</div>

<script>
// ═══ CONFIG — paste the NSW Apps Script web app URL ═══════════════
const SCRIPT_URL  = 'https://script.google.com/macros/s/AKfycbzZHA1CKPgN6J0LFtWvcN57NMvARhkB0R9GSMra3mBObsleYpS_Qora0bAywKXVGkEf/exec';
const LOGBOOK_URL = 'logbook.html';   // logbook sits beside this page in the same repo
const ADMIN_REFRESH_MIN = 5;                       // admins only; clinicians load once

// ═══ state ════════════════════════════════════════════════════════
const SKEY = 'nswa_session_v1';
let SESSION = null, TODAY = '', WARN = 30, RULES = [], RULE = {}, GROUPS = [], PEOPLE = [], ME = null;
const BASES = ['Sydney','Careflight','Wollongong','Orange','Wagga Wagga','Moruya','Newcastle','Tamworth','Port Macquarie','Lismore','Canberra'];
let BYBASE = false, MYLOGS = null, USAGE = null, USAGE_AT = 0;
let VIEW = 'overview', F = { cat: 'All', group: 'All', base: 'All', up: 'All', q: '', win: '30', cur: '', issues: false, reqOnly: true };
let refreshTimer = null, BACK = null;

function sessGet(){ try{ return JSON.parse(localStorage.getItem(SKEY)||'null'); }catch(e){ return null; } }
function sessSet(s){ try{ s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY); }catch(e){} }

// ═══ helpers ══════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function days(a,b){ return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5); }
function localToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(iso){ if(!iso) return '–'; const [y,m,d]=iso.split('-'); return d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+y; }
function fmtS(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y.slice(2); }
function initials(n){ return String(n||'?').split(',').map(p=>p.trim()[0]||'').reverse().join('').toUpperCase().slice(0,2); }
function firstLast(n){ const p=String(n).split(','); return p.length>1?(p[1].trim()+' '+p[0].trim()):n; }
const ST_LABEL = {cur:'Current',due:'Due soon',grace:'In grace',exp:'Expired',none:'No record',lc:'Completed'};
// grace = N days after expiry, or a drop-dead date set for the training year
function graceEndOf(exp,r){ if(!exp||!r) return ''; if(r.graceDate) return r.graceDate>exp?r.graceDate:''; return +r.grace>0?addDays(exp,+r.grace):''; }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function shortName(c){
  return c.replace(/^MTS\s*-?\s*NSWA\s*-\s*/i,'').replace(/^NSWA\s*-\s*/i,'')
    .replace('Operator Proficiency Check','OPC').replace(/Human Factors/i,'HF').replace('(Recurrent)','Rec')
    .replace('Procedures','Proc').replace('Rapid Sequence Induction','RSI').replace(/\s+/g,' ').trim();
}
function itemsOf(p){
  return p.it.filter(a=>RULE[a[0]]).map(a=>{
    const it={code:a[0],exp:a[1],kind:a[2],last:a[3],req:!!a[4],src:a[5],n:a[6]||0,rule:RULE[a[0]]};
    if(it.kind==='L'){ it.st='lc'; it.d=null; }
    else if(!it.exp){ it.st='none'; it.d=null; }
    else { it.d=days(TODAY,it.exp); it.graceEnd=graceEndOf(it.exp,it.rule);
      if(it.graceEnd){ it.graceLeft=days(TODAY,it.graceEnd); it.graceLen=days(it.exp,it.graceEnd); }
      it.st=it.d<0?((it.graceEnd&&TODAY<=it.graceEnd)?'grace':'exp'):(it.d<=WARN?'due':'cur'); }
    return it;
  });
}
function catOk(r){ return F.cat==='All' || r.category===F.cat; }
function peopleFiltered(){
  const q=F.q.trim().toLowerCase();
  return PEOPLE.filter(p=>(F.group==='All'||p.group===F.group)&&(F.base==='All'||(F.base==='Not set'?!p.base:p.base===F.base))&&(!q||p.name.toLowerCase().includes(q)||String(p.id).toLowerCase().includes(q)));
}
function tally(items){
  const t={cur:0,due:0,grace:0,exp:0,none:0,total:0};
  items.forEach(i=>{ if(i.req&&i.st!=='lc'&&catOk(i.rule)){ t[i.st]++; t.total++; } });
  return t;
}
function sbar(t){
  const tot=t.total||1, w=k=>(t[k]/tot*100).toFixed(2)+'%';
  return `<div class="sbar" title="${t.cur} current · ${t.due} due · ${t.grace} in grace · ${t.exp} expired · ${t.none} no record"><i class="c" style="width:${w('cur')}"></i><i class="d" style="width:${w('due')}"></i><i class="g" style="width:${w('grace')}"></i><i class="e" style="width:${w('exp')}"></i><i class="n" style="width:${w('none')}"></i></div>`;
}
const LEGEND = `<div class="legend"><span><i style="background:#22A055"></i>Current</span><span><i style="background:#F0A020"></i>Due ≤ <b class="wd"></b> days</span><span><i style="background:#3B82F6"></i>In grace</span><span><i style="background:#D93A32"></i>Expired (past grace)</span><span><i style="background:#C9CDD4"></i>No record</span></div>`;

// ═══ API ══════════════════════════════════════════════════════════
async function apiGet(params){
  const r=await fetch(SCRIPT_URL+'?'+new URLSearchParams({...params,t:Date.now()}));
  return r.json();
}
async function apiPost(body){
  const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(body)}); // text/plain → no CORS preflight
  return r.json();
}

// ═══ gate ═════════════════════════════════════════════════════════
function gmsg(t,ok){ const m=$('g-msg'); m.textContent=t||''; m.className='gmsg'+(ok?' ok':''); }
function gateMode(m){ $('g-login').style.display=m==='login'?'':'none'; $('g-reset').style.display=m==='reset'?'':'none'; $('g-title').textContent=m==='login'?'Sign in':'Set up / reset PIN'; gmsg(''); }
function showGate(){ $('gate').style.display='flex'; ['out-btn','refresh-btn','logbook-btn'].forEach(i=>$(i).style.display='none'); gateMode('login'); setTimeout(()=>$('g-id').focus(),50); }
async function doLogin(){
  const id=$('g-id').value.trim(), pin=$('g-pin').value.trim();
  if(!id||!/^\d{4}$/.test(pin)){ gmsg('Enter your Staff ID and 4-digit PIN'); return; }
  gmsg('Checking…',true);
  try{
    const j=await apiPost({action:'login',id,pin});
    if(j.status==='success'){ SESSION={token:j.token,role:j.role,id:j.id,name:j.name}; sessSet(SESSION); $('g-pin').value=''; $('gate').style.display='none'; load(true); }
    else if(j.status==='nopin'){ $('g-rid').value=id; gateMode('reset'); gmsg('No PIN set yet — request a code to create one.',true); }
    else gmsg(j.message||'Could not sign in');
  }catch(e){ gmsg('Connection problem — try again'); }
}
async function doRequestCode(){
  const id=$('g-rid').value.trim(); if(!id){ gmsg('Enter your Staff ID'); return; }
  gmsg('Sending…',true);
  try{ const j=await apiGet({action:'requestCode',id}); if(j.status==='success'){ $('g-codebox').style.display=''; gmsg(j.message,true); } else gmsg(j.message||'Could not send code'); }
  catch(e){ gmsg('Connection problem — try again'); }
}
async function doSetPin(){
  const id=$('g-rid').value.trim(), code=$('g-code').value.trim(), p1=$('g-new').value.trim(), p2=$('g-new2').value.trim();
  if(!/^\d{4}$/.test(p1)){ gmsg('PIN must be exactly 4 digits'); return; }
  if(p1!==p2){ gmsg('PINs do not match'); return; }
  try{
    const j=await apiPost({action:'setPin',id,code,pin:p1});
    if(j.status==='success'){ $('g-id').value=id; gateMode('login'); gmsg('PIN saved — sign in below.',true); $('g-codebox').style.display='none'; ['g-code','g-new','g-new2'].forEach(x=>$(x).value=''); }
    else gmsg(j.message||'Could not save PIN');
  }catch(e){ gmsg('Connection problem — try again'); }
}
function signOut(){
  const t=SESSION&&SESSION.token; SESSION=null; sessSet(null); clearTimeout(refreshTimer);
  if(t) apiGet({action:'logout',token:t}).catch(()=>{});
  PEOPLE=[]; ME=null; MYLOGS=null; $('main').innerHTML=''; showGate();
}
function openLogbook(){ window.location.href=LOGBOOK_URL; }

// ═══ data ═════════════════════════════════════════════════════════
function applyCfg(j){
  TODAY = localToday();
  if(j.config){ WARN=+j.config.warn_days||30; if(j.config.org_name) $('org').textContent=j.config.org_name; }
  if(j.rules){ RULES=j.rules; RULE={}; RULES.forEach((r,i)=>{ r.order=i; RULE[r.code]=r; }); }
  if(j.groups) GROUPS=j.groups;
}
async function load(manual){
  if(SCRIPT_URL.includes('PASTE')){ $('main').innerHTML='<div class="card empty"><b>Setup needed.</b><br>Paste the NSW Apps Script web app URL into SCRIPT_URL at the top of this file.</div>'; return; }
  SESSION = SESSION || sessGet();
  if(!SESSION){ showGate(); return; }
  if(manual && !PEOPLE.length && !ME) $('main').innerHTML='<div class="loading"><div class="spin"></div>Loading currencies…</div>';
  clearTimeout(refreshTimer);
  try{
    const admin = SESSION.role==='ADMIN';
    const j = await apiGet({action: admin?'getAll':'getMine', token:SESSION.token});
    if(j.status==='auth'){ signOut(); gmsg('Session expired — please sign in again'); return; }
    if(j.status!=='success') throw new Error(j.message||'Error');
    applyCfg(j);
    $('out-btn').style.display=''; $('refresh-btn').style.display=''; $('logbook-btn').style.display='';
    $('upd').textContent='Updated '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
    if(admin){
      PEOPLE=j.people.map(p=>({...p,items:null}));
      PEOPLE.forEach(p=>p.items=itemsOf(p));
      if(VIEW==='me') VIEW='overview';
      render();
      refreshTimer=setTimeout(()=>{ if(document.visibilityState==='visible') load(); else document.addEventListener('visibilitychange',function v(){ if(document.visibilityState==='visible'){ document.removeEventListener('visibilitychange',v); load(); } }); }, ADMIN_REFRESH_MIN*60000);
    } else {
      ME={...j.me}; ME.items=itemsOf(ME); VIEW='me'; render();
    }
  }catch(e){
    $('main').innerHTML=`<div class="card empty"><b>Could not load data.</b><br>${esc(e.message)}<br><br><button class="btn" onclick="load(true)">Try again</button></div>`;
  }
}
async function openPerson(id){
  const p=PEOPLE.find(x=>String(x.id)===String(id)); if(!p) return;
  BACK=VIEW; VIEW='person'; ME={...p,logs:null}; render(); window.scrollTo(0,0);
  try{ const j=await apiGet({action:'getPerson',token:SESSION.token,id}); if(j.status==='success'&&VIEW==='person'&&ME.id===p.id){ ME.logs=j.me.logs||[]; render(); } }catch(e){}
}

// ═══ render ═══════════════════════════════════════════════════════
function render(){
  const m=$('main');
  if(VIEW==='me'){ m.innerHTML=personView(ME,false); return; }
  if(VIEW==='mine'){   // admin's own record
    const mine=PEOPLE.find(p=>String(p.id)===String(SESSION.id));
    m.innerHTML=tabsBar()+(mine?personView({...mine,logs:MYLOGS},false):'<div class="card empty">Your Staff ID is not in the snapshot yet — run Rebuild dashboard snapshot.</div>');
    if(mine&&MYLOGS==null) apiGet({action:'getMine',token:SESSION.token}).then(j=>{ if(j.status==='success'){ MYLOGS=j.me.logs||[]; if(VIEW==='mine') render(); } }).catch(()=>{});

  if(VIEW==='person'){ m.innerHTML=`<button class="back" onclick="VIEW=BACK||'overview';render()">← Back</button>`+personView(ME,true); return; }

    <select onchange="F.base=this.value;render()"><option value="All">All bases</option>${BASES.concat(PEOPLE.some(p=>p.base&&!BASES.includes(p.base))?[...new Set(PEOPLE.map(p=>p.base).filter(b=>b&&!BASES.includes(b)))]:[]).concat(PEOPLE.some(p=>!p.base)?['Not set']:[]).map(b=>`<option ${F.base===b?'selected':''}>${esc(b)}</option>`).join('')}</select>

    <label style="font-size:12.5px;display:flex;gap:6px;align-items:center"><input type="checkbox" ${F.reqOnly?'checked':''} onchange="F.reqOnly=this.checked;render()" style="min-width:0">Required only</label>`;
  if(VIEW==='expiring') h+=`<select onchange="F.win=this.value;render()">${[['exp','Expired (past grace)'],['grace','In grace period'],['7','Due ≤ 7 days'],['30','Expired + due ≤ 30 days'],['60','Expired + due ≤ 60 days'],['90','Expired + due ≤ 90 days'],['none','No record']].map(([v,l])=>`<option value="${v}" ${F.win===v?'selected':''}>${l}</option>`).join('')}</select>
    <select onchange="F.cur=this.value;render()"><option value="">All currencies</option>${RULES.filter(catOk).map(r=>`<option value="${r.code}" ${F.cur===r.code?'selected':''}>${esc(shortName(r.currency))}</option>`).join('')}</select>
    <button class="btn ghost" onclick="downloadCSV()">Download CSV</button>`;

function overview(){
  const P=peopleFiltered();
  const t={cur:0,due:0,grace:0,exp:0,none:0,total:0}; let fully=0, peopleExp=0;
  P.forEach(p=>{ const x=tally(p.items); for(const k in t) t[k]+=x[k]; if(x.total&&!x.exp&&!x.none&&!x.grace) fully++; if(x.exp) peopleExp++; });
  const pc=t.total?Math.round((t.cur+t.due)/t.total*100):0;
  const logOnly = RULES.filter(r=>r.loggable && !PEOPLE.some(p=>p.items.some(i=>i.code===r.code&&i.src==='x')));
  const neverLogged = logOnly.filter(r=>PEOPLE.some(p=>p.items.some(i=>i.code===r.code&&i.req))&&!PEOPLE.some(p=>p.items.some(i=>i.code===r.code&&i.n>0)));
  let h='';
  if(neverLogged.length && F.cat!=='Aviation') h+=`<div class="notice"><b>Logbook currencies with no entries yet:</b> ${neverLogged.map(r=>esc(r.currency)).join(', ')}. These show as “No record” until clinicians start logging. Use the Aviation filter to see the export currencies on their own.</div>`;
  h+=`<div class="kpis">
    <div class="kpi"><div class="l">Staff in view</div><div class="v">${P.length}</div><div class="s">${fully} fully current${F.cat!=='All'?' ('+F.cat+')':''}</div></div>
    <div class="kpi cur"><div class="l">Required items current</div><div class="v">${pc}%</div><div class="s">${t.cur+t.due} of ${t.total}</div></div>
    <div class="kpi grace"><div class="l">In grace period</div><div class="v">${t.grace}</div><div class="s">past expiry, still within grace</div></div>
    <div class="kpi exp"><div class="l">Expired</div><div class="v">${t.exp}</div><div class="s">past grace · ${peopleExp} people</div></div>
    <div class="kpi due"><div class="l">Due ≤ ${WARN} days</div><div class="v">${t.due}</div><div class="s">book these now</div></div>
    <div class="kpi none"><div class="l">No record</div><div class="v">${t.none}</div><div class="s">required, never recorded</div></div>
  </div>`;
  // by group
  const keyOf=p=>BYBASE?(p.base||'Not set'):p.group;
  const ordr=BYBASE?BASES.concat(['Not set']):GROUPS;
  const groups=[...new Set(P.map(keyOf))].sort((a,b)=>{const i=ordr.indexOf(a),j=ordr.indexOf(b);return (i<0?99:i)-(j<0?99:j)||(a<b?-1:1);});
  const grows=groups.map(g=>{ const gt={cur:0,due:0,grace:0,exp:0,none:0,total:0}; const gp=P.filter(p=>keyOf(p)===g); gp.forEach(p=>{const x=tally(p.items); for(const k in gt) gt[k]+=x[k];});
    return `<div class="grow"><div class="nm">${esc(g)}<div style="font-size:11px;color:var(--muted);font-weight:500">${gp.length} staff</div></div>${sbar(gt)}<div class="pc">${gt.total?Math.round((gt.cur+gt.due)/gt.total*100):0}%</div></div>`; }).join('');
  // by currency
  const rows=RULES.filter(catOk).map(r=>{ const ct={cur:0,due:0,grace:0,exp:0,none:0,total:0};
      P.forEach(p=>{ const i=p.items.find(i=>i.code===r.code); if(i&&i.req&&i.st!=='lc'){ ct[i.st]++; ct.total++; } }); return {r,ct}; })
    .filter(x=>x.ct.total).sort((a,b)=>b.ct.exp-a.ct.exp || b.ct.grace-a.ct.grace || b.ct.due-a.ct.due || b.ct.none-a.ct.none);
  h+=`<div class="two">
    <div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px"><h2 style="margin:0">Compliance by ${BYBASE?'base':'group'}</h2><div class="seg" style="margin-left:auto"><button class="${BYBASE?'':'on'}" onclick="BYBASE=false;render()">Group</button><button class="${BYBASE?'on':''}" onclick="BYBASE=true;render()">Base</button></div></div><div class="sub">Required currencies, % current or due soon</div>${grows||'<div class="empty">No staff</div>'}${LEGEND}</div>
    <div class="card"><h2>Currencies needing attention</h2><div class="sub">Worst first · click a row to see who</div>
    <div class="tbl-wrap" style="max-height:520px"><table><thead><tr><th>Currency</th><th style="width:34%">Status</th><th class="num">Exp</th><th class="num">Grace</th><th class="num">Due</th><th class="num">None</th></tr></thead><tbody>
    ${rows.map(({r,ct})=>`<tr class="click" onclick="F.cur='${r.code}';F.win='30';VIEW='expiring';render()"><td><span class="cat ${r.category}">${r.category[0]}</span> ${esc(r.currency)}</td><td>${sbar(ct)}</td><td class="num" style="color:var(--exp)">${ct.exp||''}</td><td class="num" style="color:var(--gr)">${ct.grace||''}</td><td class="num" style="color:var(--due)">${ct.due||''}</td><td class="num" style="color:var(--none)">${ct.none||''}</td></tr>`).join('')}
    </tbody></table></div></div>
  </div>`;
  return h;
}

function matrix(){
  let P=peopleFiltered();
  if(F.issues) P=P.filter(p=>{ const t=tally(p.items); return t.exp||t.none||t.due||t.grace; });
  const cols=RULES.filter(catOk).filter(r=>P.some(p=>p.items.some(i=>i.code===r.code&&(!F.reqOnly||i.req))));
  if(!P.length||!cols.length) return '<div class="card empty">No matching staff or currencies.</div>';
  const head=`<tr><th class="nmh">${P.length} staff · ${cols.length} currencies</th>${cols.map(r=>`<th class="cat-${r.category}" title="${esc(r.currency)}"><div class="vh">${esc(shortName(r.currency))}</div></th>`).join('')}</tr>`;
  const body=P.map(p=>{ const by={}; p.items.forEach(i=>by[i.code]=i);
    return `<tr><td class="nmc" onclick="openPerson('${esc(p.id)}')" title="${esc(p.name)}">${esc(p.name)}<small>${esc(p.group)}${p.base?' · '+esc(p.base):''}</small></td>${cols.map(r=>{ const i=by[r.code];
      if(!i||(F.reqOnly&&!i.req)) return '<td class="c na"></td>';

      return `<td class="c ${i.st}${i.req?'':' opt'}" title="${esc(tip)}">${txt}</td>`; }).join('')}</tr>`; }).join('');
  return `<div class="mx-wrap"><table class="mx"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><i style="background:#C9EFD6"></i>Current</span><span><i style="background:#FDE3A6"></i>Due (days left)</span><span><i style="background:#BFDBFE"></i>G In grace</span><span><i style="background:#F7B9B5"></i>! Expired (past grace)</span><span><i style="background:#E5E7EB"></i>– No record</span><span><i style="background:#DDE4F2"></i>LC Line Check</span><span>Hover a cell for the date · click a name for detail</span></div>`;
}

function expiringRows(){
  const out=[];
  peopleFiltered().forEach(p=>p.items.forEach(i=>{
    if(!i.req||i.st==='lc'||!catOk(i.rule)||(F.cur&&i.code!==F.cur)) return;
    let ok=false;
    if(F.win==='none') ok=i.st==='none';
    else if(F.win==='exp') ok=i.st==='exp';
    else if(F.win==='grace') ok=i.st==='grace';
    else if(F.win==='7') ok=i.d!=null&&i.d>=0&&i.d<=7;
    else ok=i.d!=null&&i.d<=+F.win;
    if(ok) out.push({p,i});
  }));
  return out.sort((a,b)=>(a.i.exp||'9')<(b.i.exp||'9')?-1:(a.i.exp===b.i.exp?(a.p.name<b.p.name?-1:1):1));
}
function expiring(){
  const R=expiringRows();
  if(!R.length) return '<div class="card empty">Nothing in this window. 🎉</div>';
  return `<div class="tbl-wrap" style="max-height:calc(100vh - 230px)"><table><thead><tr><th>Name</th><th>Group</th><th>Currency</th><th>Expiry</th><th class="num">Days</th><th>Status</th><th>Source</th></tr></thead><tbody>
  ${R.map(({p,i})=>`<tr class="click" onclick="openPerson('${esc(p.id)}')"><td><b>${esc(p.name)}</b></td><td>${esc(p.group)}</td><td><span class="cat ${i.rule.category}">${i.rule.category[0]}</span> ${esc(i.rule.currency)}</td><td class="num">${fmt(i.exp)}</td><td class="num">${i.d==null?'–':i.d}</td><td><span class="pill p-${i.st}">${ST_LABEL[i.st]}</span>${i.st==='grace'?'<div style="font-size:11px;color:var(--gr);margin-top:2px">until '+fmtS(i.graceEnd)+'</div>':''}</td><td style="font-size:12px;color:var(--muted)">${i.src==='l'?'Logbook '+fmtS(i.last):i.src==='x'?'Export':''}</td></tr>`).join('')}
  </tbody></table></div><div class="legend">${R.length} items</div>`;

// ═══ Uptake: who has set a PIN, resets, sign-ins, logbook use ═══
function uptake(){
  if(!USAGE || Date.now()-USAGE_AT>120000){
    if(!uptake._busy){ uptake._busy=true;
      apiGet({action:'getUsage',token:SESSION.token}).then(j=>{ uptake._busy=false; if(j.status==='success'){ USAGE=j.users; USAGE_AT=Date.now(); if(VIEW==='uptake') render(); } })
        .catch(()=>{ uptake._busy=false; }); }
    if(!USAGE) return '<div class="loading"><div class="spin"></div>Loading uptake…</div>';
  }
  const q=F.q.trim().toLowerCase();
  const all=USAGE.filter(u=>(F.group==='All'||u.group===F.group)&&(F.base==='All'||(F.base==='Not set'?!u.base:u.base===F.base))&&(!q||u.name.toLowerCase().includes(q)||String(u.id).toLowerCase().includes(q)));
  const L=all.filter(u=>F.up==='All'||u.status===F.up);
  const n=all.length, set=all.filter(u=>u.status!=='Not set up').length, act=all.filter(u=>u.status==='Active').length;
  const seen30=all.filter(u=>u.lastSeen&&days(u.lastSeen,TODAY)<=30).length, noEmail=all.filter(u=>!u.email).length;
  const pill=s=>`<span class="pill ${s==='Active'?'p-cur':s==='Not set up'?'p-exp':'p-due'}">${s}</span>`;
  const ago=d=>{ if(!d) return '<span style="color:var(--muted)">never</span>'; const x=days(d,TODAY); return fmtS(d)+`<div style="font-size:11px;color:var(--muted)">${x===0?'today':x+' days ago'}</div>`; };
  return `<div class="kpis">
    <div class="kpi cur"><div class="l">PIN set up</div><div class="v">${n?Math.round(set/n*100):0}%</div><div class="s">${set} of ${n} staff</div></div>
    <div class="kpi exp"><div class="l">Not set up</div><div class="v">${n-set}</div><div class="s">never created a PIN</div></div>
    <div class="kpi due"><div class="l">Set up, no entries</div><div class="v">${set-act}</div><div class="s">signed in but never logged</div></div>
    <div class="kpi"><div class="l">Used in last 30 days</div><div class="v">${seen30}</div><div class="s">${act} have logged entries</div></div>
    <div class="kpi none"><div class="l">No email on file</div><div class="v">${noEmail}</div><div class="s">can't set a PIN or get reminders</div></div>
  </div>
  <div class="tbl-wrap" style="max-height:calc(100vh - 330px)"><table><thead><tr><th>Name</th><th>Group · Base</th><th>Status</th><th>PIN set</th><th class="num">Resets</th><th class="num">Sign-ins</th><th>Last used</th><th class="num">Entries</th><th>Last entry</th><th></th></tr></thead><tbody>
  ${L.map(u=>`<tr><td><b>${esc(u.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(u.id)}${u.email?'':' · <span style="color:var(--exp)">no email</span>'}</div></td>
    <td style="font-size:12.5px">${esc(u.group)}${u.base?' · '+esc(u.base):''}</td><td>${pill(u.status)}</td>
    <td class="num" style="text-align:left">${u.pinSetAt?fmtS(u.pinSetAt):'–'}</td>
    <td class="num"${u.resets>=3?' style="color:var(--due);font-weight:700"':''}>${u.resets||''}</td><td class="num">${u.logins||''}</td>
    <td style="font-size:12.5px">${ago(u.lastSeen)}</td><td class="num">${u.entries||''}</td><td style="font-size:12.5px">${u.lastEntry?fmtS(u.lastEntry):'–'}</td>
    <td>${u.pinSetAt?`<button class="btn ghost" style="padding:5px 10px;font-size:12px" onclick="resetPin('${esc(u.id)}','${esc(u.name).replace(/'/g,'&#39;')}')">Reset PIN</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="legend">${L.length} shown · <a href="#" onclick="downloadUsage();return false" style="color:var(--navy);font-weight:700">Download CSV</a> · Resets in amber = 3 or more</div>`;
}

}

function personView(p, admin){
  const items=p.items, t={cur:0,due:0,grace:0,exp:0,none:0,total:0};
  items.forEach(i=>{ if(i.req&&i.st!=='lc'){ t[i.st]++; t.total++; } });
  const order={exp:0,none:1,grace:2,due:3,cur:4};
  const row=i=>{
    const life = i.st==='grace' ? Math.max(4,Math.min(100,i.graceLeft/(i.graceLen||1)*100)) : (i.d==null?0:Math.max(0,Math.min(100, i.d/((i.rule.interval||365))*100)));
    const col = {cur:'#22A055',due:'#F0A020',grace:'#3B82F6',exp:'#D93A32'}[i.st]||'#C9CDD4';
    const src = i.src==='l'?`Logbook · last ${fmt(i.last)}${i.n>1?' · '+i.n+' entries':''}`:i.src==='x'?('Export'+(i.last?' · last logged '+fmt(i.last):'')):(i.rule.loggable?'Not logged yet':'Not in export');
    return `<div class="crow"><div><div class="nm">${esc(i.rule.currency)}</div><div class="src">${esc(src)}${i.rule.interval?' · '+i.rule.interval+'-day currency':''}${i.rule.graceDate?' · grace to '+fmt(i.rule.graceDate):+i.rule.grace?' · '+i.rule.grace+'-day grace':''}</div></div>
      <div class="dt">${i.st==='lc'?(i.src==='l'?'Done ':'LC ')+fmt(i.exp):fmt(i.exp)}</div>
      <div class="life-c">${i.st==='lc'?'':`<div class="life"><i style="width:${i.st==='exp'?100:life}%;background:${col}"></i></div><div style="font-size:11px;color:var(--muted);margin-top:3px">${i.d==null?'':i.st==='grace'?'Grace until '+fmt(i.graceEnd)+' · '+i.graceLeft+' days left':i.d<0?Math.abs(i.d)+' days overdue':i.d+' days left'}</div>`}</div>
      <div style="text-align:right"><span class="pill p-${i.st}">${ST_LABEL[i.st]}</span></div></div>`;
  };
  const section=(cat)=>{ const L=items.filter(i=>i.req&&i.st!=='lc'&&i.rule.category===cat).sort((a,b)=>order[a.st]-order[b.st]||(a.d??-1e9)-(b.d??-1e9));
    if(!L.length) return '';
    return `<div class="card" style="margin-top:16px"><div class="sec-h"><span class="cat ${cat}">${cat}</span><h3>${cat} currencies</h3></div>${L.map(row).join('')}</div>`; };
  const lc=items.filter(i=>i.st==='lc'), opt=items.filter(i=>!i.req&&i.st!=='lc');
  const logs=p.logs;
  return `<div class="card"><div class="person-head"><div class="avatar">${initials(p.name)}</div>
      <div><h2>${esc(firstLast(p.name))}</h2><div class="meta">${esc(p.group)}${p.base?' · '+esc(p.base):''} · ID ${esc(p.id)}</div></div>
      ${admin?'':`<button class="btn" style="margin-left:auto;padding:12px 18px;font-size:14px" onclick="openLogbook()">＋ Log a currency</button>`}</div></div>
    <div class="kpis" style="margin-top:16px">
      <div class="kpi cur"><div class="l">Current</div><div class="v">${t.cur}</div><div class="s">of ${t.total} required</div></div>
      <div class="kpi due"><div class="l">Due ≤ ${WARN} days</div><div class="v">${t.due}</div></div>
      <div class="kpi grace"><div class="l">In grace</div><div class="v">${t.grace}</div></div>
      <div class="kpi exp"><div class="l">Expired</div><div class="v">${t.exp}</div></div>
      <div class="kpi none"><div class="l">No record</div><div class="v">${t.none}</div></div>
    </div>
    ${section('Aviation')}${section('Mixed')}${section('Clinical')}
    ${lc.length?`<div class="card" style="margin-top:16px"><details><summary>Line Check / once-off — completed (${lc.length})</summary>${lc.map(row).join('')}</details></div>`:''}
    ${opt.length?`<div class="card" style="margin-top:16px"><details><summary>Also held — not required for ${esc(p.group)} (${opt.length})</summary>${opt.map(row).join('')}</details></div>`:''}
    <div class="card" style="margin-top:16px"><h2>Recent logbook entries</h2><div class="sub">Most recent 40</div>
      ${logs==null?'<div class="empty">Loading…</div>':!logs.length?'<div class="empty">No logbook entries yet.</div>':`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Currency</th><th>Setting</th><th>Supervisor / Assessor</th><th>Notes</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="num" style="text-align:left">${fmt(l[1])}</td><td>${esc(RULE[l[2]]?RULE[l[2]].currency:l[2])}</td><td>${esc(l[3])}</td><td>${esc(l[4])}</td><td style="font-size:12px;color:var(--ink2)">${esc(l[5])}</td></tr>`).join('')}</tbody></table></div>`}
    </div>`;
}

load(true);
</script>
</body>
</html>
